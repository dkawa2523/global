site_name: Plasma Global Model
site_description: 低圧プラズマのモデリング手順、公開仕様、理論と検証
docs_dir: docs
site_dir: site
theme:
  name: readthedocs
nav:
  - 利用手順・公開仕様: index.md
  - 理論と比較根拠: THEORY.md
  - 開発・保守: DEVELOPMENT.md
  - 計画と残る課題: ROADMAP.md
validation:
  links:
    anchors: warn
markdown_extensions:
  - tools.doc_math
  - fenced_code
  - tables
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
extra_css:
  - assets/theory.css
extra_javascript:
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js
