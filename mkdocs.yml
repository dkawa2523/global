site_name: Plasma Global Model
site_description: 低圧プラズマのモデリングマニュアル兼統合仕様書
docs_dir: docs
site_dir: site
theme:
  name: readthedocs
nav:
  - モデリングマニュアル・統合仕様: index.md
  - 理論・構成・数値検証: THEORY.md
  - 開発・保守: DEVELOPMENT.md
  - 計画と残る課題: ROADMAP.md
markdown_extensions:
  - tools.doc_math
  - fenced_code
  - tables
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
extra_css:
  - assets/theory.css
extra_javascript:
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js
