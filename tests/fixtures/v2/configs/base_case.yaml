case:
  name: icp_bias_cf4_demo
  description: >
    Base case definition for the low-pressure plasma global-model demo.
    This file holds the common physics/numerics/output defaults and is intended
    to be included by more specific case files.
  tags: [demo, global_model]
  schema_version: 2
  kind: plasma_global_case

files:
  chamber: chamber.yaml
  recipe: recipe.yaml
  chemistry:
    manifest: ../chemistry/chemistry_manifest.yaml
  output_dir: ../outputs/icp_bias_cf4_demo
runtime:
  export_effective_config: true
  export_resolved_paths: true

physics:
  mode: transient
  gas_model: multi_zone_global
  eedf_backend: maxwell
  electrical_backend: icp
  integrator: scipy_bdf
  enable_gas_temperature: true
  enable_surface_coverages: true
  enable_wall_inventory: true
  gas_heating_fraction: 0.15
  wall_relaxation_s_inv: 500.0

numerics:
  rtol: 1.0e-6
  atol: 1.0e-14
  first_step: 1.0e-10
  max_step: 1.0e-5
  positivity:
    clip_negative: true
    floor_density_m3: 1.0
    floor_energy_J_m3: 1.0e-12

outputs:
  formats:
    solution_h5: true
    observables_csv: true
    summary_yaml: true
  plots:
    enabled: true
    format: [png]
    dpi: 150
    items:
      - electron_density_vs_time
      - mean_energy_vs_time
      - self_bias_vs_time
