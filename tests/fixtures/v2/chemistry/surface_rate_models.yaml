rate_models:
  RM_S_F_WAFER_STICK:
    backend: sticking
    sticking_value: 0.02
    coverage_factor:
      kind: site_blocking
      site_species: wafer:*
      exponent: 1.0
  RM_S_CF3_POLYMERIZE:
    backend: sticking
    sticking_value: 0.01
    coverage_factor:
      kind: site_blocking
      site_species: wafer:*
      exponent: 1.0
  RM_S_F_WALL_STICK:
    backend: sticking
    sticking_value: 0.005
    coverage_factor:
      kind: site_blocking
      site_species: wall:*
      exponent: 1.0
  RM_S_F_SOURCE_RECOMB:
    backend: sticking
    sticking_value: 0.1
    coverage_factor:
      kind: constant
  RM_S_AR_ION_DESORB:
    backend: ion_assisted
    yield_value: 0.25
    threshold_eV: 15.0
    reference_energy_eV: 120.0
    energy_exponent: 1.0
    coverage_factor:
      kind: species_power
      species: wafer:F*
      exponent: 1.0
  RM_S_F_DESORB:
    backend: desorption
    nu0_s_inv: 2.0e4
    Ea_eV: 0.25
  RM_S_F_LH_RECOMB:
    backend: langmuir_hinshelwood
    A_m2_s_inv: 5.0e3
    Ea_eV: 0.05
