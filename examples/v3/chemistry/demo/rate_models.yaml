  RM_E_CF4_DISS:
    kind: electron_impact
    cross_section: xs_cf4_dissociation
    branching_yield: 1.0
  RM_E_O2_DISS:
    kind: electron_impact
    cross_section: xs_o2_dissociation
    branching_yield: 1.0
  RM_E_O2_ATTACH:
    kind: electron_impact
    cross_section: xs_o2_attachment
    branching_yield: 1.0
