tool: zdplaskin_examples_inventory
source:
  repository: https://github.com/Hemadityamalla/ZDPlaskin
  local_repo: <temp>/zdplaskin_repo_check
  commit: 48744203fe93368d344315645e9617ed351cadd3
examples:
- path: example1
  description: Minimal Ar ionization plus three-body recombination at fixed E/N.
  available_files:
    chemistry: example1/kinetics.inp
    driver: example1/main.F90
  committed_reference_output: false
  benchmark_status: live_run_required
  why_not_used_now:
  - The repository does not include a clean committed time-history output for example1.
  - On this Windows environment the Linux ZDPlaskin/BOLSIG shared library is not directly
    rerun as the external reference.
  - CRANE already covers the same scalar two-reaction Ar ODE axis with committed reference
    output.
- path: example2
  description: Ar DC-series discharge with circuit output and committed time history.
  available_files:
    output: example2/Ar2Reac_1000V_100kOhm_100t_0.4d_0.4r.dat
    chemistry: example2/kinetics.inp
    driver: example2/main.f90
    conditions: example2/conditions.ini
  committed_reference_output: true
  benchmark_status: implemented_strict_external_reference
  local_tools:
  - tools/external_benchmarks/zdplaskin_example2.py
  - tools/external_benchmarks/zdplaskin_eovern.py
  - tools/external_benchmarks/same_footing_assessment.py
- path: example3
  description: N2 DBD0D driven-chemistry example with prescribed E/N and prescribed
    electron density.
  available_files:
    input_profile: example3/data_in.dat
    output_profile: example3/out.dat
    chemistry: example3/kinetics.inp
    driver: example3/main.F90
  input_profile:
    columns:
    - Time_s
    - Field_Td
    - Electrons_cm-3
    row_count: 30
    time_s:
      min: 0.0
      max: 0.00025
    reduced_field_Td:
      min: 0.57491
      max: 159.77012
    electron_density_cm3:
      min: 2430.07511
      max: 50788600.0
  output_profile:
    columns:
    - TIME
    - E/N
    - E
    - N
    - N2
    - N2(A)
    - N2(B)
    - N2(A')
    - N2(C)
    - N^+
    - N2^+
    - N3^+
    - N4^+
    row_count: 290
    time_s:
      min: 7.02576e-06
      max: 0.0025
    reduced_field_Td:
      min: 7.85506
      max: 159.664
    species_count: 11
    final_values_cm3:
      E: 1330460.0
      N2: 2.44746e+19
      N2(A): 6130710000000.0
      N2(A'): 1104970000.0
      N2(C): 20902100.0
      N2^+: 2844940.0
      N3^+: 7823080000000.0
      N4^+: 1246520000000.0
  benchmark_status: reference_ingested_only
  why_not_strict_parity_yet:
  - The ZDPlaskin driver fixes electron density from data_in.dat at every step.
  - This code currently treats electron density as a solved plasma state in normal
    global-model cases.
  - The N2 mechanism has many excited/cluster-ion states and would need explicit species
    metadata plus a prescribed-electron-density chemistry-driver mode.
  recommended_next_use: Use as a future driven-chemistry regression after adding a
    clean prescribed-ne, prescribed-E/N driver outside production plasma closures.
recommendation_order:
- Keep example2 as the strict ZDPlaskin same-footing benchmark.
- Use example3 next only as a driven-chemistry benchmark after adding prescribed electron-density
  and prescribed E/N driver support.
- Use example1 only if a reproducible external run artifact is generated and committed,
  because CRANE already validates the same simple ODE axis.
passed: true
