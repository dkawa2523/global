evaluation:
  execution_mode: digitized_reference_consistency_check
  assessment: LoKI reference data are digitized through the full diagnostic benchmark,
    including radial-profile checks from figures 1, 2, 3, 4, 7b, and 10.
  key_findings:
  - Directly reconstructible main discharge parameters from figures 5a and 5b stay
    within the paper-level 5 percent envelope.
  - Figure 11 envelope data are digitized as an external acceptance reference on their
    observed six-pressure subset.
  - Charged-species proxy from e, O-, and O2+ remains well below the figure 11 aggregate
    charged envelope, which is consistent with the paper-level aggregate covering
    a broader charged set.
  - Electron-temperature relative difference remains reference-only because Te pressure-sweep
    curves are not part of the digitized pressure-sweep set.
  - The extended neutral subset now follows the same rising pressure trend as figure
    11 and stays below the aggregate neutral envelope at all overlapping pressures.
  - 'O3 remains the dominant high-pressure outlier: the digitized 1D-versus-0D difference
    reaches about a factor 3.4 at 10 Torr.'
  - O2(X) stays close between 0D and 1D, while O2(a), O2(b), and O3 account for most
    of the growing high-pressure neutral-species spread.
  - 'Figures 1 to 4 preserve the expected radial directionality: Tg, E/N, and ne decrease
    toward the wall, while O(3P) increases.'
  - 'At 10 Torr the charged-species profile diagnostic stays strongly center-peaked
    in 1D: O2+ edge-to-center ratio is about 0.0049.'
  - 'At 10 Torr the chemistry split from figure 10 is preserved: O3 is wall-peaked
    with edge-to-center ratio about 46.7, while O2(b) stays center-peaked with edge-to-center
    ratio about 0.0261.'
