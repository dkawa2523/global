tool: loki_o2_dc_glow_digitization_schema
scope: external_candidate_only
source_spec: C:\Users\user\Desktop\Global_model\plasma_review_updated\examples\external\loki_o2_dc_glow_candidate.yaml
digitization_root: C:\Users\user\Desktop\Global_model\plasma_review_updated\examples\external\loki_o2_dc_glow_digitized
schema_definitions:
  pressure_sweep:
    columns:
    - pressure_Torr
    - series_id
    - quantity_id
    - symbol
    - value
    - unit
    - source_figure
    - source_panel
    - digitization_method
    - note
    required_nonempty_columns:
    - pressure_Torr
    - series_id
    - quantity_id
    - value
    - unit
    - source_figure
    description: Pressure-sweep digitization points for paired 1D and 0D curves.
  profile_curve:
    columns:
    - pressure_Torr
    - radius_mm
    - series_id
    - quantity_id
    - symbol
    - value
    - unit
    - source_figure
    - source_panel
    - digitization_method
    - note
    required_nonempty_columns:
    - pressure_Torr
    - radius_mm
    - series_id
    - quantity_id
    - value
    - unit
    - source_figure
    description: Radial-profile digitization points at one pressure or a small pressure
      set.
  acceptance_envelope:
    columns:
    - pressure_Torr
    - metric_id
    - value_percent
    - source_figure
    - source_panel
    - digitization_method
    - note
    required_nonempty_columns:
    - pressure_Torr
    - metric_id
    - value_percent
    - source_figure
    description: Relative-difference envelope from the paper-level acceptance summary.
