include: base_case.yaml

case:
  name: zdplaskin_example2_dc_series
  description: >
    Local executable parity case using the species set, nominal pressure,
    nominal geometry, DC source/resistor drive, and output-derived E/N-rate
    table from ZDPlaskin example2. The numerical method remains local to this
    code; the benchmark setup is intentionally isolated from production Ar
    cases.
  tags: [argon, zdplaskin, example2, benchmark, executable_comparison]

files:
  chamber: chamber_zdplaskin_example2.yaml
  recipe: recipe_zdplaskin_example2.yaml
  chemistry:
    manifest: ../chemistry_zdplaskin_example2/chemistry_manifest.yaml
  output_dir: ../outputs/zdplaskin_example2_surrogate

physics:
  eedf_backend: rate_table
  electrical_backend: dc_series_circuit
  enable_gas_temperature: false
  enable_surface_coverages: false
  enable_wall_inventory: false
  enable_ied_proxy: false

swarm:
  model_name: table
  closure: local_field
  table:
    file: tables/zdplaskin_example2_eovern_rates.h5
    lookup: local_field
    electron_energy_mode: table_relaxation
    energy_relaxation_time_s: 1.0e-6

numerics:
  rtol: 3.0e-6
  atol: 1.0e-14
  first_step: 1.0e-12
  max_step: 1.0e-6

outputs:
  diagnostics:
    reaction_budget:
      enabled: true
      filename: reaction_budget.yaml
      species: [Ar_star, Ar_plus, Ar2_plus]
      max_reactions_per_species: 6
    electron_energy_budget:
      enabled: true
      filename: electron_energy_budget.yaml
      max_reactions: 8
    surface_reaction_budget:
      enabled: true
      filename: surface_reaction_budget.yaml
      max_reactions_per_species: 6
    state_manifest:
      enabled: true
      filename: state_manifest.yaml
    provenance:
      enabled: true
      filename: run_provenance.yaml
  plots:
    enabled: false
