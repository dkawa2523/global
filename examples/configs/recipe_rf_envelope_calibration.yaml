recipe_id: argon_rf_envelope_calibration
description: >
  Pure-argon RF-envelope calibration example. The HF source is power-driven
  with an explicit absorbed-power coupling efficiency. The LF bias is
  voltage-driven with an explicit effective impedance and self-bias fraction.

steps:
  - step_id: ignition
    t_start_s: 0.0
    t_end_s: 2.0e-4
    gas_inlets:
      showerhead:
        Ar: 100.0
    power_ports:
      source_rf:
        role: hf_source
        zone_id: source
        frequency_Hz: 1.356e7
        value_W: 500.0
        coupling_efficiency: 0.55
        base_reduced_field_Td: 25.0
        reduced_field_per_sqrt_W_Td: 1.0
        waveform: cw
      wafer_bias:
        role: lf_bias
        zone_id: process
        frequency_Hz: 2.0e6
        voltage_rms_V: 50.0
        effective_impedance_ohm: 200.0
        coupling_efficiency: 0.15
        self_bias_fraction: 0.30
        plasma_potential_from_bias_fraction: 0.10
        waveform: cw

  - step_id: production
    t_start_s: 2.0e-4
    t_end_s: 2.2e-3
    gas_inlets:
      showerhead:
        Ar: 100.0
    power_ports:
      source_rf:
        role: hf_source
        zone_id: source
        frequency_Hz: 1.356e7
        value_W: 1500.0
        coupling_efficiency: 0.65
        base_reduced_field_Td: 25.0
        reduced_field_per_sqrt_W_Td: 0.8
        waveform: cw
      wafer_bias:
        role: lf_bias
        zone_id: process
        frequency_Hz: 2.0e6
        voltage_rms_V: 120.0
        effective_impedance_ohm: 200.0
        coupling_efficiency: 0.20
        self_bias_fraction: 0.35
        plasma_potential_from_bias_fraction: 0.10
        waveform: cw

  - step_id: afterglow
    t_start_s: 2.2e-3
    t_end_s: 2.6e-3
    gas_inlets:
      showerhead:
        Ar: 100.0
    power_ports:
      source_rf:
        role: hf_source
        zone_id: source
        frequency_Hz: 1.356e7
        value_W: 0.0
        coupling_efficiency: 0.65
        waveform: off
      wafer_bias:
        role: lf_bias
        zone_id: process
        frequency_Hz: 2.0e6
        voltage_rms_V: 0.0
        effective_impedance_ohm: 200.0
        coupling_efficiency: 0.20
        self_bias_fraction: 0.35
        waveform: off
