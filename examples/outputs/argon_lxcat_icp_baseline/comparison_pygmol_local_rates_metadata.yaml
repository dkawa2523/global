rate_policy:
  status: same_electron_collision_rates_projected_to_pygmol_arrhenius
  local_case: native local Ar LXCat/two-term workflow remains unchanged
  pygmol_case: uses generated external-benchmark-only Arrhenius fits to local electron-impact
    rate coefficients
  reason: This isolates electron-collision-rate differences while keeping geometry,
    wall, and PyGMol equation-form differences visible.
equivalent_cylinder:
  volume_m3: 0.04
  area_m2: 0.6614
  radius_m: 0.15951158183553765
  length_m: 0.5004096486460946
limitations:
- Local model is two-zone; PyGMol comparison is a single equivalent cylinder.
- Local electron energy is EEDF mean energy; PyGMol reports electron temperature.
- Local wafer ion flux and PyGMol total cylinder-wall Ar+ flux are not identical observables.
- Same-rate modes align electron-impact rate coefficients only; they do not align
  wall-loss or flow equations.
- local-absorbed power mode reuses local total_absorbed_power_W as the PyGMol power
  waveform.
- local-coefficient wall-loss mode replaces PyGMol positive-ion surface loss with
  the local global k_wall(t).
