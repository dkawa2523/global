benchmark_limitations:
- benchmark: ZDPlaskin example2
  limitation: single committed Ar discharge case
  why_it_matters: strong for same-footing DC parity, weak for generality across chemistry
    and operating space
- benchmark: CRANE TwoReactionArgon
  limitation: scalar chemistry only
  why_it_matters: does not validate circuit closure, wall loss, transport closure,
    or electron-energy physics
- benchmark: PyGMol Ar baseline / same-footing
  limitation: independent executable model with different native closure choices
  why_it_matters: useful for sensitivity decomposition, but not a strict accuracy
    proof for the local solver
- benchmark: LoKI O2 DC glow
  limitation: digitized publication figures rather than official raw-output files
  why_it_matters: good for pressure trends and profile-shape credibility, but not
    raw-output parity
