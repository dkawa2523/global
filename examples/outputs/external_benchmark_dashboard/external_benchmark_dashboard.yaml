assessment:
  summary:
  - ZDPlaskin and CRANE remain the strictest same-footing parity references in the
    current external set.
  - PyGMol baseline remains a broad executable global-model comparison; same-rate
    and same-footing stages show how much of the gap comes from rates, power, and
    wall loss.
  - LoKI is a digitized-reference benchmark, not a raw-output executable parity case,
    but it now covers both pressure-sweep and full radial-profile diagnostics.
  - The main benchmark report now cross-references the separate robustness suite so
    strict validation and applicability evidence can be read side by side without
    being conflated.
  - The generated Markdown report is organized for a paper-style Methods/Results narrative
    and can be used as a drafting base.
  - A short benchmark-limitations table plus main-text and supplementary versions
    of the concluding validation table are included to keep the manuscript claims
    disciplined.
