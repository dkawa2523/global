tool: plasma_global_run_provenance
case:
  name: zdp_voltage_1500V
  description: 'Local executable parity case using the species set, nominal pressure,
    nominal geometry, DC source/resistor drive, and output-derived E/N-rate table
    from ZDPlaskin example2. The numerical method remains local to this code; the
    benchmark setup is intentionally isolated from production Ar cases.

    '
  tags:
  - argon
  - zdplaskin
  - example2
  - benchmark
  - executable_comparison
  - robustness_sweep
  schema_version: 2
  source_config: C:\Users\user\Desktop\Global_model\plasma_review_updated\examples\outputs\robustness_sweep\_generated_configs\case_zdp_voltage_1500V.yaml
inputs:
  chamber_file: C:\Users\user\Desktop\Global_model\plasma_review_updated\examples\outputs\robustness_sweep\_generated_configs\chamber_zdp_voltage_1500V.yaml
  recipe_file: C:\Users\user\Desktop\Global_model\plasma_review_updated\examples\configs\recipe_zdplaskin_example2.yaml
  chemistry_manifest: C:\Users\user\Desktop\Global_model\plasma_review_updated\examples\chemistry_zdplaskin_example2\chemistry_manifest.yaml
  chemistry_dir: C:\Users\user\Desktop\Global_model\plasma_review_updated\examples\chemistry_zdplaskin_example2
  external_inputs:
    comsol_anchor_yaml: C:\Users\user\Desktop\Global_model\plasma_review_updated\examples\outputs\robustness_sweep\external\comsol_anchor.yaml
    power_waveform_h5: null
    geometry_override_yaml: null
model_selection:
  mode: transient
  gas_model: multi_zone_global
  eedf_backend: rate_table
  electrical_backend: dc_series_circuit
  integrator: scipy_bdf
  quasi_neutrality: algebraic
  electron_density_closure: quasi_neutral
  electron_density_state: algebraic_from_ion_charge_balance
  prescribed_electron_profile: null
swarm:
  model_name: table
  closure: local_field
  rate_table:
    file: C:\Users\user\Desktop\Global_model\plasma_review_updated\examples\chemistry_zdplaskin_example2\tables\zdplaskin_example2_wide_eovern_rates.h5
    exists: true
    lookup: local_field
    electron_energy_mode: table_relaxation
    energy_relaxation_time_s: 1.0e-06
    hdf5_attributes:
      generator: tools/external_benchmarks/build_zdplaskin_rate_table.py
      grid: EoverN_Td
      grid_column: EoverN_Td
      max_EoverN_Td: 250.0
      min_EoverN_Td: 0.5
      n_fields: 64
      note: Diagnostic wide-range table generated from the repository internal two-term-like
        solver using the ZDPlaskin cross-section bundle; not a BOLSIG+ executable
        rerun and not the ZDPlaskin parity table.
      source: ZDPlaskin example2 bolsigdb.dat cross sections
      source_directory: C:\Users\user\Desktop\Global_model\plasma_review_updated\examples\chemistry_zdplaskin_example2\tables\zdplaskin_example2_wide_eovern
    sidecar_metadata: {}
chemistry:
  species_count: 5
  gas_state_species_count: 4
  gas_reaction_count: 10
  surface_reaction_count: 0
  cross_sections:
    xs_zdp_ar_effective:
      kind: momentum_transfer
      target_species: Ar
      collider_species: e
      threshold_eV: 0.0
      energy_loss_eV: 0.0
      source: file
      file: C:\Users\user\Desktop\Global_model\plasma_review_updated\examples\chemistry_zdplaskin_example2\cross_sections\xs_zdp_ar_effective.csv
      format: csv_xy
      metadata:
        source_repo: https://github.com/Hemadityamalla/ZDPlaskin
        source_file: example2/bolsigdb.dat
        original_process: Ar
        original_kind: EFFECTIVE
        mass_ratio: 1.36e-05
        reader: simple_xy
      has_tabulated_data: true
    xs_zdp_ar_excitation:
      kind: excitation
      target_species: Ar
      collider_species: e
      threshold_eV: 11.5
      energy_loss_eV: 11.5
      source: file
      file: C:\Users\user\Desktop\Global_model\plasma_review_updated\examples\chemistry_zdplaskin_example2\cross_sections\xs_zdp_ar_excitation.csv
      format: csv_xy
      metadata:
        source_repo: https://github.com/Hemadityamalla/ZDPlaskin
        source_file: example2/bolsigdb.dat
        original_process: Ar <-> Ar*
        original_kind: EXCITATION
        reader: simple_xy
      has_tabulated_data: true
    xs_zdp_ar_star_deexcitation:
      kind: deexcitation
      target_species: Ar_star
      collider_species: e
      threshold_eV: 0.0
      energy_loss_eV: 0.0
      source: file
      file: C:\Users\user\Desktop\Global_model\plasma_review_updated\examples\chemistry_zdplaskin_example2\cross_sections\xs_zdp_ar_star_deexcitation.csv
      format: csv_xy
      metadata:
        source_repo: https://github.com/Hemadityamalla/ZDPlaskin
        source_file: example2/Ar2Reac_1000V_100kOhm_100t_0.4d_0.4r.dat
        original_process: Ar* -> Ar
        original_kind: output_derived_superelastic_rate
        reader: simple_xy
      has_tabulated_data: true
    xs_zdp_ar_ionization:
      kind: ionization
      target_species: Ar
      collider_species: e
      threshold_eV: 15.8
      energy_loss_eV: 15.8
      source: file
      file: C:\Users\user\Desktop\Global_model\plasma_review_updated\examples\chemistry_zdplaskin_example2\cross_sections\xs_zdp_ar_ionization.csv
      format: csv_xy
      metadata:
        source_repo: https://github.com/Hemadityamalla/ZDPlaskin
        source_file: example2/bolsigdb.dat
        original_process: Ar -> Ar^+
        original_kind: IONIZATION
        reader: simple_xy
      has_tabulated_data: true
    xs_zdp_ar_star_ionization:
      kind: ionization
      target_species: Ar_star
      collider_species: e
      threshold_eV: 4.3
      energy_loss_eV: 4.3
      source: file
      file: C:\Users\user\Desktop\Global_model\plasma_review_updated\examples\chemistry_zdplaskin_example2\cross_sections\xs_zdp_ar_star_ionization.csv
      format: csv_xy
      metadata:
        source_repo: https://github.com/Hemadityamalla/ZDPlaskin
        source_file: example2/bolsigdb.dat
        original_process: Ar* -> Ar^+
        original_kind: IONIZATION
        source_warning: ZDPlaskin file states this is shifted from ground-state ionization
          and is not a real cross section.
        reader: simple_xy
      has_tabulated_data: true
  rate_models:
    RM_E_AR_ION_ZDP:
      backend: electron_impact_xsec
      cross_section_id: xs_zdp_ar_ionization
    RM_E_AR_EXC_ZDP:
      backend: electron_impact_xsec
      cross_section_id: xs_zdp_ar_excitation
    RM_E_ARSTAR_DEEXC_ZDP:
      backend: electron_impact_xsec
      cross_section_id: xs_zdp_ar_star_deexcitation
    RM_E_ARSTAR_ION_ZDP:
      backend: electron_impact_xsec
      cross_section_id: xs_zdp_ar_star_ionization
    RM_AR2PLUS_DISS_RECOMB_ZDP:
      backend: te_power_law
      A: 8.5e-13
      Tref_K: 300.0
      alpha: -0.67
    RM_AR2PLUS_CONVERSION_ZDP:
      backend: arrhenius
      A: 2.02e-14
      beta: -1.0
      Ea_eV: 1.3038025225625385
    RM_ARSTAR_POOLING_ZDP:
      backend: constant
      value: 6.0e-16
    RM_ARPLUS_THREE_BODY_RECOMB_ZDP:
      backend: te_power_law
      A: 8.749999999999999e-39
      Tref_K: 11600.0
      alpha: -4.5
    RM_ARSTAR_THREE_BODY_QUENCH_ZDP:
      backend: constant
      value: 1.4e-44
    RM_ARPLUS_CLUSTERING_ZDP:
      backend: arrhenius
      A: 2.25e-43
      beta: -0.4
      Ea_eV: 0.0
    EM_E_AR_ION_ZDP:
      backend: constant_event_loss
      energy_loss_eV: 15.8
    EM_E_AR_EXC_ZDP:
      backend: constant_event_loss
      energy_loss_eV: 11.5
    EM_E_ARSTAR_ION_ZDP:
      backend: constant_event_loss
      energy_loss_eV: 4.3
chamber:
  zone_count: 1
  surface_count: 1
  power_ports:
    dc_series_drive:
      kind: dc_series_circuit
      zone_id: plasma
      coupling_target: plasma
      parameters:
        source_voltage_V: 1500.0
        ballast_resistance_ohm: 100000.0
        gap_m: 0.004
        electrode_area_m2: 5.0265482457e-05
        power_absorption_fraction: 1.0
        mobility_source: config
        conductance_multiplier: 1.0
        electron_mobility_m2_V_s: 0.45
backends:
  eedf_backend_class: TableEEDFBackend
  electrical_backend_class: DCSeriesCircuitBackend
  integrator_class: SciPyBDFIntegrator
validation_messages:
- level: WARNING
  code: LOCAL_FIELD_CLOSURE_REDUCED_MODEL
  message: swarm.closure=local_field uses the electrical backend reduced-field proxy;
    verify or calibrate zone_reduced_field_Td for production studies.
  entity_id: swarm.closure
