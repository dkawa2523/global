limitations:
- The local case uses this repository internal dc_series_circuit backend with the
  ZDPlaskin source, ballast, gap, and area settings.
- Electron-impact rates are read from a local external E/N-rate table reverse-engineered
  from the committed ZDPlaskin output, not from a live BOLSIG+ executable call.
- The Ar* de-excitation/superelastic channel is represented by the output-derived
  E/N-rate table.
- The benchmark uses a ZDPlaskin-style first-order diffusion loss setting; it is not
  a general wall-model validation.
