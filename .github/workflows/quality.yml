name: quality-pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HYPOTHESIS_PROFILE: ci
      QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      UV_CACHE_DIR: .uv-cache
    steps:
      - name: Check out the complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync the locked quality environment
        run: uv sync --frozen --extra dev

      - name: Run the clean-checkout PR gate
        run: uv run --frozen quality-pr

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-pr-reports
          path: .quality-reports/
          if-no-files-found: ignore
