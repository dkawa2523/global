schema_version: 4
case:
  name: argon_maxwellian
  description: Standard single-zone Ar example with absorbed power and afterglow.
chemistry:
  file: ../chemistry/argon_lxcat/chemistry.yaml
reactor:
  chamber_id: argon
  zones:
    plasma:
      volume_m3: 0.01
      initial:
        pressure_Pa: 0.8283894
        gas_temperature_K: 300.0
        densities_m3:
          Ar: 2.0e+20
          Ar_plus: 100000000000000.0
        mean_energy_eV: 3.0
  surfaces:
    wall:
      zone_id: plasma
      area_m2: 0.1
      temperature_K: 300.0
      wall_transport:
        kind: bohm
        h_factor: auto
  power_ports:
    source:
      zone_id: plasma
      model:
        kind: prescribed_power
        electron_fraction: 1.0
        gas_fraction: 0.0
run:
  steps:
  - label: powered
    duration_s: 0.001
    commands:
      power_ports:
        source:
          absorbed_power_W: 0.1
  - label: afterglow
    duration_s: 0.001
    commands:
      power_ports:
        source:
          absorbed_power_W: 0.0
models:
  electrons:
    kind: energy_balance
solver:
  sample_interval_s: 1.0e-05
output:
  observables:
  - electron_density_m3[plasma]
  - electron_temperature_eV[plasma]
  - absorbed_power_W[plasma]
  summary_series:
  - electron_density_m3[plasma]
  - electron_temperature_eV[plasma]
