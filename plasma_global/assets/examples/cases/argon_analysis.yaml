schema_version: 4
case:
  name: argon_analysis
  description: Standard Ar with named region probes, composition plots and Graphviz
    reaction event networks.
chemistry:
  file: ../chemistry/argon_lxcat/chemistry.yaml
reactor:
  chamber_id: argon
  zones:
    plasma:
      volume_m3: 0.01
      initial:
        pressure_Pa: 0.8283894
        gas_temperature_K: 300.0
        densities_m3:
          Ar: 2.0e+20
          Ar_plus: 100000000000000.0
        mean_energy_eV: 3.0
  surfaces:
    wall:
      zone_id: plasma
      area_m2: 0.1
      temperature_K: 300.0
      wall_transport:
        kind: bohm
        h_factor: auto
  power_ports:
    source:
      zone_id: plasma
      model:
        kind: prescribed_power
        electron_fraction: 1.0
        gas_fraction: 0.0
run:
  steps:
  - label: powered
    duration_s: 0.001
    commands:
      power_ports:
        source:
          absorbed_power_W: 0.1
  - label: afterglow
    duration_s: 0.001
    commands:
      power_ports:
        source:
          absorbed_power_W: 0.0
models:
  electrons:
    kind: energy_balance
solver:
  sample_interval_s: 1.0e-05
output:
  quantities:
  - electron_density_m3
  - electron_temperature_eV
  - pressure_Pa
  - absorbed_power_W
  zones:
  - plasma
  csv: true
  reaction_rates: true
  probes:
    bulk:
      zone: plasma
      quantities:
      - number_density_m3
      - mole_fraction
      - electron_density_m3
      - electron_temperature_eV
    wall:
      surface: wall
      species:
      - Ar_plus
      quantities:
      - incident_flux_m2_s
      - wall_sheath_energy_eV
    source:
      power_port: source
  plots:
    densities:
      kind: composition
      zone: plasma
      species:
      - Ar
      - Ar_plus
      yscale: log
      time_unit: ms
    fractions:
      kind: composition
      zone: plasma
      quantity: mole_fraction
      species:
      - Ar
      - Ar_plus
      yscale: log
      time_unit: ms
    plasma:
      series:
      - electron_density_m3[plasma]
      - electron_temperature_eV[plasma]
      - absorbed_power_W[plasma]
      time_unit: ms
  networks:
    mechanism:
      mode: mechanism
      domains:
      - gas
      - boundary
      format: svg
    events:
      mode: events
      species: [Ar_plus]
      domains:
      - gas
      - boundary
      min_fraction: 0.05
      format: svg
  summary_series:
  - electron_density_m3[plasma]
  - electron_temperature_eV[plasma]
