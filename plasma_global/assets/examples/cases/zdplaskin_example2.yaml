schema_version: 4
case:
  name: zdplaskin_example2_dc_series
  description: 'Local executable parity case using the species set, nominal pressure,
    nominal geometry, DC source/resistor drive, and output-derived E/N-rate table
    from ZDPlaskin example2. The numerical method remains local to this code; the
    benchmark setup is intentionally isolated from calibrated reactor cases.

    '
chemistry:
  file: ../chemistry/zdplaskin_example2/chemistry.yaml
reactor:
  chamber_id: zdplaskin_example2_single_zone
  description: 'Single-zone chamber matching the nominal dimensions and pressure of
    ZDPlaskin example2. The original example is a voltage-resistor circuit discharge;
    this chamber carries the geometry, pressure, gas, wall area, and a local DC series-circuit
    power port into the global-model framework. The electron-impact rates are supplied
    separately by the case E/N-rate table.

    '
  zones:
    plasma:
      volume_m3: 2.010619298e-07
      description: ZDPlaskin example2 cylinder volume
      initial:
        pressure_Pa: 13332.23684
        gas_temperature_K: 300.0
        densities_m3:
          Ar: 3.218833278166041e+24
          Ar_star: 0.0
          Ar_plus: 1000000000000.0
          Ar2_plus: 1000000000000.0
  surfaces:
    wall:
      zone_id: plasma
      area_m2: 0.0002010619298
      temperature_K: 300.0
      wall_transport:
        kind: prescribed_frequency
        frequency_s_inv: 3230.0
      site_density_m2: 1.0e+18
  gas_inlets:
    initial_argon_seed:
      zone_id: plasma
      temperature_K: 300.0
      flow_sccm:
        Ar: 1.0e-30
  power_ports:
    dc_series_drive:
      zone_id: plasma
      model:
        kind: dc_series
        ballast_resistance_ohm: 100000.0
        gap_m: 0.004
        electrode_area_m2: 5.0265482457e-05
        source_voltage_V: 1000.0
run:
  steps:
  - label: dc_series_circuit
    duration_s: 0.001
    commands:
      gas_inlets:
        initial_argon_seed:
          flow_sccm:
            Ar: 1.0e-30
      power_ports:
        dc_series_drive: {}
models:
  electrons:
    kind: local_field
    coefficients:
      file: ../data/zdplaskin_example2/electrons.csv
      mobility_reference_neutral_density_m3: 3.218833278166041e+24
      provenance:
        converted_from_hdf5:
          name: zdplaskin_example2_eovern_rates.h5
          sha256: fa469b82fe486c10d25de10587a0cb3cb057661b7a7d26f201c5f12e678417de
          attributes:
            format: plasma_global_electron_kinetics
            format_version: 1
            grid_column: EoverN_Td
            note: Rates are reverse-engineered from saved ZDPlaskin reaction-rate
              columns, including the BOLSIG+/superelastic behavior present in that
              run.
            provenance: tools/benchmarks/build_zdplaskin_rate_table.py
            source: ZDPlaskin example2 committed output
            source_artifact: example2/Ar2Reac_1000V_100kOhm_100t_0.4d_0.4r.dat
            source_repository: https://github.com/Hemadityamalla/ZDPlaskin
solver:
  rtol: 3.0e-06
  first_step_s: 1.0e-12
  max_step_s: 1.0e-06
  sample_interval_s: 5.025125628140704e-06
output:
  observables:
  - electron_density_m3[plasma]
  - mean_energy_eV[plasma]
  - reduced_field_Td[plasma]
  - absorbed_power_W[plasma]
  - charge_residual_m3[plasma]
  summary_series:
  - n[plasma,Ar]
  - n[plasma,Ar_star]
  - n[plasma,Ar_plus]
  - n[plasma,Ar2_plus]
  - electron_density_m3[plasma]
  - reduced_field_Td[plasma]
  - absorbed_power_W[plasma]
