schema_version: 4
species:
  - {id: e, charge: -1, mass_amu: 0.00054858, state_tags: [electron]}
  - {id: Ar, mass_amu: 39.948, elements: {Ar: 1}, state_tags: [parent, stable]}
  - {id: Ar_star, mass_amu: 39.948, elements: {Ar: 1}, state_tags: [excited, metastable]}
  - {id: Ar_plus, charge: 1, mass_amu: 39.948, elements: {Ar: 1}}
  - {id: Ar2_plus, charge: 1, mass_amu: 79.896, elements: {Ar: 2}}
gas_reactions:
  - id: ZDP_AR_ION
    equation: e + Ar -> 2 e + Ar_plus
    rate: {kind: electron_table, rate_id: xs_zdp_ar_ionization}
    electron_energy_transfer_eV: -15.8
  - id: ZDP_AR_EXC
    equation: e + Ar -> Ar_star + e
    rate: {kind: electron_table, rate_id: xs_zdp_ar_excitation}
    electron_energy_transfer_eV: -11.5
  - id: ZDP_ARSTAR_DEEXC
    equation: Ar_star + e -> Ar + e
    rate: {kind: electron_table, rate_id: xs_zdp_ar_star_deexcitation}
    electron_energy_transfer_eV: 11.5
  - id: ZDP_ARSTAR_ION
    equation: e + Ar_star -> Ar_plus + 2 e
    rate: {kind: electron_table, rate_id: xs_zdp_ar_star_ionization}
    electron_energy_transfer_eV: -4.3
  - id: ZDP_AR2PLUS_DISS_RECOMB
    equation: Ar2_plus + e -> Ar_star + Ar
    rate:
      kind: experimental.electron_temperature_power_law
      A: 8.5e-13
      reference_temperature_K: 300.0
      exponent: -0.67
  - id: ZDP_AR2PLUS_CONVERSION
    equation: Ar2_plus + Ar -> Ar_plus + 2 Ar
    rate: {kind: arrhenius, A: 2.02e-14, beta: -1.0, activation_eV: 1.3038025225625385}
  - id: ZDP_ARSTAR_POOLING
    equation: 2 Ar_star -> Ar2_plus + e
    rate: {kind: constant, value: 6.0e-16}
  - id: ZDP_ARPLUS_THREE_BODY_RECOMB
    equation: Ar_plus + 2 e -> Ar + e
    rate:
      kind: experimental.electron_temperature_power_law
      A: 8.75e-39
      reference_temperature_K: 11600.0
      exponent: -4.5
  - id: ZDP_ARSTAR_THREE_BODY_QUENCH
    equation: Ar_star + 2 Ar -> 3 Ar
    rate: {kind: constant, value: 1.4e-44}
  - id: ZDP_ARPLUS_CLUSTERING
    equation: Ar_plus + 2 Ar -> Ar2_plus + Ar
    rate: {kind: arrhenius, A: 2.25e-43, beta: -0.4, activation_eV: 0.0}
boundary_reactions:
  - {id: wall_Ar_plus_absorption, equation: Ar_plus -> 0}
  - {id: wall_Ar2_plus_absorption, equation: Ar2_plus -> 0}
provenance:
  reaction_mechanism: https://github.com/Hemadityamalla/ZDPlaskin/blob/48744203fe93368d344315645e9617ed351cadd3/example2/kinetics.inp
  cross_section_source: https://github.com/Hemadityamalla/ZDPlaskin/blob/48744203fe93368d344315645e9617ed351cadd3/example2/bolsigdb.dat
  note: Ionization from Ar* uses the shifted ground-state curve in the reference input.
