schema_version: 4
case:
  name: analytic-transport
  description: 異なる2容積間の一方向移送。解析解と体積積分した粒子数を比較する。
chemistry:
  species:
  - id: e
    charge: -1
    mass_amu: 0.00054858
    state_tags:
    - electron
  - id: Ar
    mass_amu: 39.948
    elements:
      Ar: 1.0
  - id: Ar_plus
    charge: 1
    mass_amu: 39.948
    elements:
      Ar: 1.0
reactor:
  zones:
    source:
      volume_m3: 0.01
      initial:
        pressure_Pa: 1.0
        gas_temperature_K: 300.0
        mole_fractions:
          Ar: 1.0
        seed_densities_m3:
          Ar_plus: 1.0e12
        mean_energy_eV: 3.0
    target:
      volume_m3: 0.03
      initial:
        pressure_Pa: 0.25
        gas_temperature_K: 300.0
        mole_fractions:
          Ar: 1.0
        seed_densities_m3:
          Ar_plus: 1.0e12
        mean_energy_eV: 3.0
  edges:
    transfer:
      from_zone: source
      to_zone: target
      conductance_m3_s: 0.02
models:
  electrons:
    kind: energy_balance
run:
  duration_s: 0.5
solver:
  sample_interval_s: 0.005
output:
  csv: true
