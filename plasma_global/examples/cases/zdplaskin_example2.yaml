schema_version: 5
case:
  name: zdplaskin_example2_dc_series
  description: ZDPlasKin example2の初期状態・両極性壁損失・DC直列回路に、固定組成の電子係数を使う比較例。
chemistry:
  file: ../chemistry/zdplaskin_example2/chemistry.yaml
reactor:
  chamber_id: zdplaskin_example2_single_zone
  zones:
    plasma:
      volume_m3: 2.01056e-07
      initial:
        pressure_Pa: 13332.236842105263
        gas_temperature_K: 300.0
        densities_m3:
          Ar: 3.218830947284555e+24
          Ar_plus: 1.0e+12
  surfaces:
    wall:
      zone_id: plasma
      area_m2: 2.01056e-04
      temperature_K: 300.0
      wall_transport:
        kind: ambipolar
        # Cylinder diffusion length and D_a at T_e = 1 eV, from kinetics.inp.
        diffusion_length_m: 0.001011123314936048
        diffusion_coefficient_m2_s: 0.0012691997244610963
        electron_temperature_reference_eV: 1.0
  power_ports:
    dc_series_drive:
      zone_id: plasma
      model:
        kind: dc_series
        ballast_resistance_ohm: 100000.0
        gap_m: 0.004
        electrode_area_m2: 5.0264e-05
        source_voltage_V: 1000.0
run:
  duration_s: 0.0007520833
models:
  electrons:
    kind: local_field
    coefficients:
      file: ../data/zdplaskin_example2/electrons.csv
      provenance:
        solver: BOLSIG+ 07/2024
        cross_sections: https://github.com/Hemadityamalla/ZDPlaskin/blob/48744203fe93368d344315645e9617ed351cadd3/example2/bolsigdb.dat
        input: benchmarks/references/zdplaskin_example2_bolsig.in
        gas_temperature_K: 300.0
        neutral_density_m3: 3.218830947284555e+24
        mole_fractions: {Ar: 1.0, Ar_star: 0.0}
        growth: temporal
        mobility: flux_drift_over_field
solver:
  rtol: 3.0e-07
  atol: 1.0e-16
  first_step_s: 1.0e-12
  max_step_s: 5.0e-07
  sample_interval_s: 5.025125628140704e-06
output:
  observables:
  - electron_density_m3[plasma]
  - neutral_density_m3[plasma]
  - mean_energy_eV[plasma]
  - reduced_field_Td[plasma]
  - absorbed_power_W[plasma]
  - charge_residual_m3[plasma]
  - port_plasma_voltage_V[dc_series_drive]
  - port_current_A[dc_series_drive]
  - port_reduced_field_Td[dc_series_drive]
  summary_series:
  - n[plasma,Ar]
  - n[plasma,Ar_star]
  - n[plasma,Ar_plus]
  - n[plasma,Ar2_plus]
  - electron_density_m3[plasma]
  - reduced_field_Td[plasma]
  - absorbed_power_W[plasma]
  csv: true
