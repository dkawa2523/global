schema_version: 5
case:
  name: gas_heating_flow
  description: 一定比熱のArに流入・排気・気体加熱・壁緩和を加える小例。総粒子密度を一定とし、温度の指数緩和を解析解と比較できる。
chemistry:
  species:
  - id: e
    charge: -1
    mass_amu: 0.00054858
    state_tags:
    - electron
  - id: Ar
    mass_amu: 39.948
    elements:
      Ar: 1.0
    cv_over_kb: 1.5
  - id: Ar_plus
    charge: 1
    mass_amu: 39.948
    elements:
      Ar: 1.0
    cv_over_kb: 1.5
reactor:
  zones:
    plasma:
      volume_m3: 0.01
      initial:
        pressure_Pa: 0.828389404141947
        gas_temperature_K: 300.0
        mole_fractions:
          Ar: 1.0
        seed_densities_m3:
          Ar_plus: 1000000000000.0
        mean_energy_eV: 3.0
  surfaces:
    wall:
      zone_id: plasma
      area_m2: 0.05
      temperature_K: 350.0
      wall_transport:
        kind: 'off'
  gas_inlets:
    feed:
      zone_id: plasma
      temperature_K: 400.0
      flow_sccm:
        Ar: 0.44663166358802947
  pumps:
    pump:
      zone_id: plasma
      speed_m3_s: 0.001
  power_ports:
    heater:
      zone_id: plasma
      model:
        kind: prescribed_power
        electron_fraction: 0.0
        gas_fraction: 1.0
        absorbed_power_W: 0.01
models:
  electrons:
    kind: energy_balance
  gas_energy:
    kind: evolved
    wall_energy_relaxation_s_inv_by_zone:
      plasma: 2.0
run:
  duration_s: 0.02
solver:
  rtol: 1.0e-08
  sample_interval_s: 0.001
  max_step_s: 0.001
output:
  csv: true
  summary_series:
  - gas_temperature_K[plasma]
  - heavy_density_m3[plasma]
