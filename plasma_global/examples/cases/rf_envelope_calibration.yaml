schema_version: 5
case:
  name: experimental_argon_rf_envelope_calibration
  description: 'Experimental pure-Ar RF-envelope calibration case for tuning coupling_efficiency,
    effective_impedance_ohm, and self_bias_fraction. Its empirical HF/LF response
    is intended for calibration and qualitative trends, not uncalibrated production
    accuracy.

    '
chemistry:
  file: ../chemistry/argon_lxcat/chemistry.yaml
reactor:
  chamber_id: argon_icp_two_zone_reactor
  description: 'Pure-argon two-zone ICP baseline chamber. Argon enters the source
    zone, flows to the process zone, and is pumped from the process zone.

    '
  zones:
    source:
      volume_m3: 0.01
      description: upstream ICP source zone
      initial:
        pressure_Pa: 8.0
        gas_temperature_K: 350.0
        densities_m3:
          Ar: 1.6555361179519817e+21
          Ar_plus: 1000000000000.0
    process:
      volume_m3: 0.03
      description: downstream process zone
      initial:
        pressure_Pa: 8.0
        gas_temperature_K: 340.0
        densities_m3:
          Ar: 1.7042283567152754e+21
          Ar_plus: 1000000000000.0
  surfaces:
    wafer:
      zone_id: process
      area_m2: 0.0314
      temperature_K: 320.0
      wall_transport:
        kind: bohm
      site_density_m2: 5.0e+18
    grounded_wall:
      zone_id: process
      area_m2: 0.45
      temperature_K: 330.0
      wall_transport:
        kind: bohm
      site_density_m2: 3.0e+18
    source_wall:
      zone_id: source
      area_m2: 0.18
      temperature_K: 360.0
      wall_transport:
        kind: bohm
      site_density_m2: 3.0e+18
  edges:
    source_to_process:
      from_zone: source
      to_zone: process
      conductance_m3_s: 0.03
  gas_inlets:
    showerhead:
      zone_id: source
      temperature_K: 300.0
      flow_sccm:
        Ar: 100.0
  pumps:
    main_pump:
      zone_id: process
      speed_m3_s: 0.03
  power_ports:
    source_rf:
      zone_id: source
      model:
        kind: experimental.rf_envelope
        coupling_efficiency: 0.65
        base_reduced_field_Td: 25.0
        reduced_field_per_sqrt_W_Td: 0.8
    wafer_bias:
      zone_id: process
      model:
        kind: experimental.rf_envelope
        role: bias
        frequency_Hz: 2000000.0
        control: voltage
        effective_impedance_ohm: 200.0
        coupling_efficiency: 0.2
run:
  steps:
  - label: ignition
    duration_s: 0.0002
    commands:
      gas_inlets:
        showerhead:
          flow_sccm:
            Ar: 100.0
      power_ports:
        source_rf:
          absorbed_power_W: 500.0
        wafer_bias:
          voltage_rms_V: 50.0
  - label: calibration_hold
    duration_s: 0.002
    commands:
      gas_inlets:
        showerhead:
          flow_sccm:
            Ar: 100.0
      power_ports:
        source_rf:
          absorbed_power_W: 1500.0
        wafer_bias:
          voltage_rms_V: 120.0
  - label: afterglow
    duration_s: 0.00039999999999999975
    commands:
      gas_inlets:
        showerhead:
          flow_sccm:
            Ar: 100.0
      power_ports:
        source_rf:
          absorbed_power_W: 0.0
        wafer_bias:
          voltage_rms_V: 0.0
models:
  electrons:
    kind: local_field
    coefficients:
      file: ../data/swarm_argon_rf/electrons.csv
      provenance:
        source_repository: https://github.com/dkawa2523/swarm
        source_revision: 27ada948f9845859fc3b7fc3bbb7ac96b07d5b5c
        source_working_tree_python_sha256: ae56a74fbbd074e09af88f92d0caf613aac3aec28c8a2f044fa7bdcbef4a0887
        source_execution_id: a2156f2a314762e85350e467662edc4103e24bcb5e09487b9977cffd085fc97e
        source_manifest_sha256: 85c1c92932d16de12c5b8e32f8b08e537e357d1cd15ba2a926784ccb50cb1525
        solver: two_term
        backend: native_sg
        gas_temperature_K: 350.0
        pressure_Pa: 8.0
        mole_fractions:
          Ar: 1.0
        cross_sections_sha256: ce8d45175fa4a738ebc1d56aaec3c6ca12f089b0aec3c40a098d289afe14ab74
        chemistry_definition_sha256: 573f367686b1bbd85f8aa65c9dd979a79705d8c9da77c69bbeb1c4f68f74d357
        elastic_threshold_eV: 0.0
        source_elastic_mass_ratio: 1.36e-05
        cross_section_source_doi: 10.5281/zenodo.8192503
        mobility: flux drift over field, exported as mu*N
        fixed_state_scope: Pure Ar at 350 K. Shared by both example zones; runtime gas
          temperature does not regenerate the coefficients.
        purpose: Independent coefficient input for illustrative RF/ICP/CCP coupling; DC
          coefficients are a local-field approximation, not an RF swarm solution or device
          validation.
        fields_Td:
          min: 1.0
          max: 200.0
          points: 82
        coefficient_csv_sha256: 5e6a90eee6cc19ca2f49b24085807f7690cf697a2c62c3f9d5b67e37d6486e1b
  surface_kinetics:
    kind: mass_action
solver:
  first_step_s: 1.0e-10
  max_step_s: 2.0e-06
  sample_interval_s: 1.3065326633165828e-05
output:
  observables:
  - electron_density_m3[source]
  - mean_energy_eV[source]
  - reduced_field_Td[source]
  - absorbed_power_W[source]
  - electron_density_m3[process]
  - mean_energy_eV[process]
  - reduced_field_Td[process]
  - absorbed_power_W[process]
  summary_series:
  - n[source,Ar_plus]
  - n[process,Ar_plus]
  - electron_density_m3[source]
  - reduced_field_Td[source]
  - electron_density_m3[process]
  - reduced_field_Td[process]
  - absorbed_power_W[process]
