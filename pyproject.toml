[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plasma-global-model"
version = "0.1.0"
description = "YAML-driven low-pressure plasma global model research platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
io = ["h5py>=3.10"]
plot = ["matplotlib>=3.7"]
compare = ["pygmol>=1.1,<2"]
docs = ["mkdocs>=1.6"]
dev = ["pytest>=8.0", "ruff>=0.5", "h5py>=3.10"]

[project.scripts]
plasma-global = "plasma_global.cli:main"

[tool.setuptools.packages.find]
include = ["plasma_global*"]

[tool.pytest.ini_options]
testpaths = [
  "tests/test_cli_and_case.py",
  "tests/test_conservation_validation.py",
  "tests/test_crane_two_reaction_argon.py",
  "tests/test_dc_series_circuit.py",
  "tests/test_external_circuit_table.py",
  "tests/test_numerics.py",
  "tests/test_physics_consistency.py",
  "tests/test_rate_table_builder.py",
  "tests/test_rf_envelope.py",
  "tests/test_runner_failure.py",
  "tests/test_smoke_run.py",
  "tests/test_zdplaskin_example2_case.py",
]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tools/external_benchmarks/*.py" = ["E402"]
