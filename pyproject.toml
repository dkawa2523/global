[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plasma-global-model"
version = "0.1.0"
description = "YAML-driven low-pressure plasma global model research platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.10",
  "numpy>=1.26",
  "pydantic>=2.8",
  "scipy>=1.11",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
docs = ["mkdocs>=1.6"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
plasma-global = "plasma_global.cli:main"

[tool.setuptools.packages.find]
include = ["plasma_global*", "tools*"]
exclude = ["*.assets", "*.assets.*", "*.__pycache__", "*.__pycache__.*"]

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not external_benchmark'"
markers = [
  "external_benchmark: tests for optional external benchmark helpers",
]

[tool.deptry]
optional_dependencies_dev_groups = ["dev", "docs"]

[tool.ruff]
extend-exclude = [
  ".pytest_cache",
  ".ruff_cache",
  ".uv-cache",
  ".venv",
  "**/__pycache__",
  "*.egg-info",
  "build",
  "dist",
  "htmlcov",
  "site",
]

[tool.ruff.lint.per-file-ignores]
"tools/benchmarks/*.py" = ["E402"]
