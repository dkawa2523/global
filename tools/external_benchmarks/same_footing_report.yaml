tool: same_footing_assessment
scope: External benchmark comparison axes only; this is not core solver logic.
outputs:
  zdplaskin_comparison: C:\Users\user\Desktop\Global_model\plasma_review_updated\examples\outputs\zdplaskin_example2_surrogate\comparison_zdplaskin_example2.yaml
  zdplaskin_eovern_comparison: C:\Users\user\Desktop\Global_model\plasma_review_updated\examples\outputs\zdplaskin_example2_surrogate\comparison_zdplaskin_eovern.yaml
  crane_comparison: C:\Users\user\Desktop\Global_model\plasma_review_updated\examples\outputs\crane_two_reaction_argon\comparison_crane_two_reaction_argon.yaml
benchmarks:
- benchmark: ZDPlaskin example2
  simple_verdict:
    current_local_run_matches_zdplaskin: true
    current_run_EoverN_matches_zdplaskin: true
    forced_zdplaskin_voltage_formula_check_matches: true
    composition_matches_zdplaskin: true
    plain_language: The local case is on the same practical footing for this benchmark
      when power, E/N, and final composition all match within the configured tolerances.
      This is a ZDPlaskin parity case, not a claim that unrelated production cases
      are validated.
    what_matches:
    - geometry
    - pressure
    - gas_temperature
    - E/N unit formula check
    - absorbed_power
    - E/N used by the local run
    - uses an internal circuit backend
    - species composition within factor 2
    what_does_not_match: []
  same_footing_axes:
    geometry_pressure_temperature:
      status: same_input
      local_gap_m: 0.004
      zdplaskin_gap_m: 0.004
      local_pressure_Pa: 13332.226994717474
      zdplaskin_pressure_Pa: 13332.0
      local_Tg_K: 300.0
      zdplaskin_Tg_K: 300.0
      assessment: The local surrogate uses the same nominal gap, pressure, and gas
        temperature as the ZDPlaskin example.
    absorbed_power:
      status: same_footing_pass
      local_absorbed_power_W: 0.3204667388401192
      zdplaskin_voltage_current_power_W: 0.32118765493749996
      ratio_local_over_zdplaskin: 0.9977554676018884
      assessment: The local run computes absorbed power from the internal circuit
        backend while using the external E/N-rate table; it is not forced to the ZDPlaskin
        final V*I value.
    reduced_field_from_voltage_gap_density:
      status: matched
      zdplaskin_saved_EoverN_Td: 2.561342
      zdplaskin_recomputed_EoverN_Td: 2.580367428133438
      local_EoverN_if_using_zdplaskin_final_voltage_Td: 2.5803234947548987
      same_voltage_ratio_local_over_zdplaskin_saved: 1.0074107615284873
      same_voltage_matches_formula_only: true
      local_reported_EoverN_Td: 2.574326264261928
      local_reported_ratio_over_zdplaskin_saved: 1.0050693207943056
      current_run_EoverN_matches: true
      local_equivalent_gap_voltage_V: 33.145283716670505
      zdplaskin_final_gap_voltage_V: 33.2225
      assessment: The current local run reports an E/N from its active electrical
        backend. The forced-voltage value is kept only as a formula check.
    species_densities_and_composition:
      status: same_footing_pass
      final_electron_density_ratio_local_over_zdplaskin: 1.0155415965470813
      peak_electron_density_ratio_local_over_zdplaskin: 0.9013794634263897
      final_Ar_star_ratio_local_over_zdplaskin: 1.021388497502308
      final_Ar_plus_ratio_local_over_zdplaskin: 1.0285347989742408
      final_Ar2_plus_ratio_local_over_zdplaskin: 1.0154557128266992
      assessment: Final species densities are compared as benchmark parity diagnostics.
        The transient peak density is reported separately and is not part of the final-composition
        pass/fail flag.
  overall_assessment:
    same_footing_for_power: true
    same_footing_for_physical_EoverN_formula: true
    current_local_run_is_EoverN_parity_case: true
    current_local_run_matches_zdplaskin: true
    conclusion: The local run uses the internal DC series-circuit backend and output-derived
      external E/N-rate table. For this isolated benchmark, judge agreement from the
      explicit power, E/N, and final-composition axes.
- benchmark: CRANE TwoReactionArgon
  same_footing_axes:
    reaction_network_and_rates:
      status: same_footing_pass
      species:
      - e
      - Ar
      - Ar_plus
      ionization_rate_m3_s: 2.1736169000623e-18
      recombination_rate_m6_s: 1.0e-37
      assessment: The same two reactions and prescribed rate constants are used after
        cm-to-SI conversion.
    initial_conditions:
      status: same_footing_pass
      initial_Ar_density_m3: 2.5e25
      initial_Ar_plus_density_m3: 1.0e6
      initial_electron_density_m3: 1.0e6
      assessment: The local chamber explicit initial densities reproduce the CRANE
        cm-based initial state in SI.
    ode_solution:
      status: same_footing_pass
      final_electron_density_relative_error: 2.366088494351468e-06
      final_Ar_plus_density_relative_error: 2.366088494351468e-06
      final_Ar_density_relative_error: 2.0442344114842075e-12
      assessment: This validates scalar reaction-network assembly and stiff ODE integration
        for the CRANE tutorial scope.
    reduced_field:
      status: not_a_dynamic_field_comparison
      prescribed_reduced_field_Td: 30.0
      assessment: CRANE TwoReactionArgon uses E/N only to select a prescribed ionization
        rate table value; it does not solve E/N dynamics.
  overall_assessment:
    same_footing_for_scalar_ode_chemistry: true
    same_footing_for_full_plasma_discharge: false
    conclusion: CRANE comparison is a strong same-footing ODE chemistry benchmark.
      It should not be read as validation of EEDF, wall loss, circuit, or surface
      physics.
overall_conclusion:
  crane_same_footing_result: pass for scalar ODE chemistry
  zdplaskin_same_footing_result: pass for the isolated ZDPlaskin example2 parity axes
    when power, E/N, and final composition are within tolerance
  next_step_for_zdplaskin_same_footing: Keep this as an external benchmark; use separate
    cases before claiming general predictive accuracy for other pressures, chemistries,
    or RF/DC closures.
