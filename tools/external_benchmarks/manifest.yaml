version: 2

phase_policy:
  phase1:
    description: Use committed external references, PyGMol if installed, and local reruns available in this environment.
  phase2:
    description: Add live CRANE, ZDPlaskin, BOLSIG+, and LoKI execution when those external programs are installed.

artifact_policy:
  tracked_light_artifacts:
    - examples/outputs/external_benchmarks/**/*.md
    - examples/outputs/external_benchmarks/**/*.csv
    - examples/outputs/external_benchmarks/**/*.yaml
    - examples/outputs/external_benchmarks/**/*.png
  regenerated_artifacts:
    - examples/outputs/**/solution.h5
    - examples/outputs/**/observables.csv
    - examples/outputs/**/effective_case.yaml
    - examples/outputs/**/resolved_paths.yaml

diagnostic_categories:
  crane_ode_parity:
    suspected_modules:
      - plasma_global/chemistry/io.py
      - plasma_global/physics/gas_phase_core.py
      - plasma_global/numerics/system.py
      - plasma_global/numerics/scipy_backend.py
    recommendation: Check reaction stoichiometry, SI conversion, state layout, and BDF tolerances.
  zdplaskin_species_final:
    suspected_modules:
      - plasma_global/eedf/table.py
      - plasma_global/physics/gas_phase_core.py
      - examples/chemistry_zdplaskin_example2
    recommendation: Check Ar*, Ar+, Ar2+ reaction mapping, rate-table IDs, and final-state loss terms.
  zdplaskin_species_transient:
    suspected_modules:
      - plasma_global/eedf/table.py
      - plasma_global/electrical/dc_series.py
      - plasma_global/physics/gas_phase_core.py
    recommendation: Compare peak timing, rate-table relaxation, circuit loading, and diffusion-loss closure separately.
  zdplaskin_circuit:
    suspected_modules:
      - plasma_global/electrical/dc_series.py
      - plasma_global/observables/defaults.py
      - plasma_global/io/time_series.py
    recommendation: Check E/N formula, voltage-current power, time-series interpolation, and observable column definitions.
  zdplaskin_rate_table:
    suspected_modules:
      - plasma_global/eedf/table.py
      - scripts/build_rate_table_h5.py
      - tools/external_benchmarks/build_zdplaskin_output_rate_table.py
    recommendation: Check HDF5 datasets, required cross-section IDs, lookup mode, interpolation, and table provenance.
  pygmol_same_footing:
    suspected_modules:
      - tools/external_benchmarks/pygmol_argon.py
      - plasma_global/reactor/models.py
      - plasma_global/physics/gas_phase_core.py
      - plasma_global/physics/surface_core.py
    recommendation: Add a true single-cylinder, same-chemistry, same-wall-loss local case before making precision claims.
  pygmol_precision_harness:
    suspected_modules:
      - tools/external_benchmarks/pygmol_precision.py
      - tools/external_benchmarks/pygmol_argon_model.yaml
    recommendation: Check same-footing fixture generation, PyGMol-style power sanitization, initial state, and wall-return equations.
  swarm_table_ingestion:
    suspected_modules:
      - plasma_global/eedf/table.py
      - scripts/build_rate_table_h5.py
      - plasma_global/chemistry/io.py
    recommendation: Check units, HDF5 schema, finite data, sorted grid, lookup mode, clipping, and provenance.
  runtime_context:
    suspected_modules:
      - plasma_global/numerics/scipy_backend.py
      - plasma_global/workflows/runner.py
      - plasma_global/io/hdf5_writer.py
    recommendation: Separate solver cost from output I/O and inspect nfev, njev, and nlu before optimizing.

benchmarks:
  - id: CRANE-1
    software: CRANE
    phase: phase1
    problem: TwoReactionArgon constant-rate scalar ODE
    case: ../../examples/configs/case_crane_two_reaction_argon.yaml
    reference: ../../examples/external/crane_two_reaction_argon_reference.yaml
    claim_level: strong
    validates:
      - reaction ODE assembly
      - CRANE cm-based values converted to SI
      - final Ar, Ar+, and electron densities
    does_not_validate:
      - electron-energy closure
      - wall loss
      - circuit physics
    metrics:
      - id: final_Ar_relative_error
        group: species_final
        value_path: comparison.final_Ar_density_m3_relative_error
        threshold: {max: 5.0e-4}
        diagnostic_category: crane_ode_parity
      - id: final_Ar_plus_relative_error
        group: species_final
        value_path: comparison.final_Ar_plus_density_m3_relative_error
        threshold: {max: 5.0e-4}
        diagnostic_category: crane_ode_parity
      - id: final_e_relative_error
        group: species_final
        value_path: comparison.final_electron_density_m3_relative_error
        threshold: {max: 5.0e-4}
        diagnostic_category: crane_ode_parity
      - id: charge_balance_relative_error
        group: conservation
        generated: crane_charge_balance_relative_error
        threshold: {max: 1.0e-12}
        diagnostic_category: crane_ode_parity

  - id: ZDPlaskin-1
    software: ZDPlaskin
    phase: phase1
    problem: example2 Ar DC series discharge final/transient/circuit parity
    case: ../../examples/configs/case_zdplaskin_example2.yaml
    reference: ../../examples/external/zdplaskin_example2_summary.yaml
    claim_level: scoped
    validates:
      - final Ar*, Ar+, Ar2+, and electron density
      - final reduced field and voltage-current absorbed power
      - peak electron density as a separate transient diagnostic
    does_not_validate:
      - live ZDPlaskin executable runtime
      - full species waveform parity without full external species time series
    metrics:
      - id: final_e_relative_error
        group: species_final
        generated: zdp_final_e_relative_error
        threshold: {max: 5.0e-2}
        diagnostic_category: zdplaskin_species_final
      - id: final_Ar_star_relative_error
        group: species_final
        generated: zdp_final_Ar_star_relative_error
        threshold: {max: 5.0e-2}
        diagnostic_category: zdplaskin_species_final
      - id: final_Ar_plus_relative_error
        group: species_final
        generated: zdp_final_Ar_plus_relative_error
        threshold: {max: 5.0e-2}
        diagnostic_category: zdplaskin_species_final
      - id: final_Ar2_plus_relative_error
        group: species_final
        generated: zdp_final_Ar2_plus_relative_error
        threshold: {max: 5.0e-2}
        diagnostic_category: zdplaskin_species_final
      - id: peak_e_relative_error
        group: species_transient
        generated: zdp_peak_e_relative_error
        threshold: {max: 5.0e-2, status_on_fail: fail}
        diagnostic_category: zdplaskin_species_transient
      - id: final_EoverN_relative_error
        group: circuit_final
        generated: zdp_final_EoverN_relative_error
        threshold: {max: 5.0e-2}
        diagnostic_category: zdplaskin_circuit
      - id: final_power_relative_error
        group: circuit_final
        generated: zdp_final_power_relative_error
        threshold: {max: 5.0e-2}
        diagnostic_category: zdplaskin_circuit
      - id: circuit_EoverN_waveform_nrmse
        group: circuit_transient
        generated: zdp_circuit_EoverN_waveform_nrmse
        threshold: {max: 5.0e-1, status_on_fail: warn}
        diagnostic_category: zdplaskin_circuit
      - id: reaction_budget_columns_present
        group: model_diagnostics
        generated: zdp_reaction_budget_columns_present
        threshold: {min: 1.0}
        diagnostic_category: zdplaskin_species_transient
      - id: electrical_waveform_columns_present
        group: model_diagnostics
        generated: zdp_electrical_waveform_columns_present
        threshold: {min: 1.0}
        diagnostic_category: zdplaskin_circuit
      - id: peak_window_budget_generated
        group: model_diagnostics
        generated: zdp_peak_window_budget_generated
        threshold: {min: 1.0}
        diagnostic_category: zdplaskin_species_transient

  - id: ZDPlaskin-2
    software: ZDPlaskin
    phase: phase1
    problem: output-derived E/N rate-table parity and ingestion
    case: ../../examples/configs/case_zdplaskin_example2.yaml
    reference: ../../examples/chemistry_zdplaskin_example2/tables/zdplaskin_example2_eovern_rates.h5
    claim_level: strong
    validates:
      - HDF5 rate-table schema
      - required cross-section rate IDs
      - local-field lookup and interpolation
    does_not_validate:
      - live BOLSIG+ execution
      - cross-section physics beyond the committed ZDPlaskin-derived table
    metrics:
      - id: required_datasets_present
        group: schema
        generated: zdp_table_required_datasets_present
        threshold: {min: 1.0}
        diagnostic_category: zdplaskin_rate_table
      - id: required_rates_present
        group: schema
        generated: zdp_table_required_rates_present
        threshold: {min: 1.0}
        diagnostic_category: zdplaskin_rate_table
      - id: field_axis_strictly_increasing
        group: grid
        generated: zdp_table_field_axis_strictly_increasing
        threshold: {min: 1.0}
        diagnostic_category: zdplaskin_rate_table
      - id: final_field_inside_table
        group: grid
        generated: zdp_table_final_field_inside_table
        threshold: {min: 1.0}
        diagnostic_category: zdplaskin_rate_table
      - id: local_field_interpolation_finite
        group: interpolation
        generated: zdp_table_local_field_interpolation_finite
        threshold: {min: 1.0}
        diagnostic_category: zdplaskin_rate_table
      - id: lookup_diagnostics_present
        group: diagnostics
        generated: zdp_table_lookup_diagnostics_present
        threshold: {min: 1.0}
        diagnostic_category: zdplaskin_rate_table
      - id: clipping_diagnostics_present
        group: diagnostics
        generated: zdp_table_clipping_diagnostics_present
        threshold: {min: 1.0}
        diagnostic_category: zdplaskin_rate_table

  - id: PyGMol-1
    software: PyGMol
    phase: phase1
    problem: pure-Ar global-model sanity check and precision-claim scoping
    case: ../../examples/configs/case_argon_lxcat.yaml
    reference: ../../tools/external_benchmarks/pygmol_argon_model.yaml
    claim_level: sanity
    validates:
      - powered-step density/energy/power scale when PyGMol is installed
      - whether precision claims are explicitly scoped out until same-footing parity exists
    does_not_validate:
      - full waveform parity
      - precision same-footing until a true single-cylinder local case exists
    metrics:
      - id: powered_final_ne_ratio_min
        group: powered_sanity
        generated: pygmol_powered_final_ne_ratio_min
        threshold: {min: 1.0e-3, max: 1.0e3}
        diagnostic_category: pygmol_same_footing
      - id: powered_final_ne_ratio_max
        group: powered_sanity
        generated: pygmol_powered_final_ne_ratio_max
        threshold: {min: 1.0e-3, max: 1.0e3}
        diagnostic_category: pygmol_same_footing
      - id: precision_claim_scoped_out
        group: claim_scope
        generated: pygmol_precision_claim_scoped_out
        threshold: {min: 1.0}
        diagnostic_category: pygmol_same_footing

  - id: PyGMol-Precision-1
    software: PyGMol
    phase: phase1
    problem: same-footing compact-Ar precision harness
    case: ../../examples/configs/case_argon_lxcat.yaml
    reference: ../../tools/external_benchmarks/pygmol_argon_model.yaml
    claim_level: scoped
    validates:
      - local tools-side implementation of the PyGMol compact Ar equations
      - identical geometry, chemistry, power waveform, wall return, and initial state
      - final values and sampled waveforms for Ar, Ar+, e, T_e, T_n, pressure, and power
    does_not_validate:
      - production plasma_global low-pressure physics closure
      - LXCat/two-zone case agreement with PyGMol
    metrics:
      - id: same_footing_axes_aligned
        group: fixture
        generated: pygmol_precision_same_footing_axes_aligned
        threshold: {min: 1.0}
        diagnostic_category: pygmol_precision_harness
      - id: max_final_relative_error
        group: precision_final
        generated: pygmol_precision_max_final_relative_error
        threshold: {max: 1.0e-3}
        diagnostic_category: pygmol_precision_harness
      - id: max_waveform_nrmse
        group: precision_waveform
        generated: pygmol_precision_max_waveform_nrmse
        threshold: {max: 1.0e-3}
        diagnostic_category: pygmol_precision_harness
      - id: electron_density_waveform_nrmse
        group: precision_waveform
        generated: pygmol_precision_e_waveform_nrmse
        threshold: {max: 1.0e-3}
        diagnostic_category: pygmol_precision_harness
      - id: final_Te_relative_error
        group: precision_final
        generated: pygmol_precision_final_T_e_relative_error
        threshold: {max: 1.0e-3}
        diagnostic_category: pygmol_precision_harness

  - id: SWARM-1
    software: BOLSIG+/LoKI-compatible table
    phase: phase1
    problem: external swarm table ingestion contract
    case: ../../examples/configs/case_zdplaskin_example2.yaml
    reference: ../../examples/chemistry_zdplaskin_example2/tables/zdplaskin_example2_eovern_rates.h5
    claim_level: strong
    validates:
      - table units and schema expected by rate_table
      - finite interpolation through the runtime backend
      - required electron-impact rates are present
    does_not_validate:
      - live external swarm solver accuracy
    metrics:
      - id: table_reader_prepares
        group: backend
        generated: swarm_table_reader_prepares
        threshold: {min: 1.0}
        diagnostic_category: swarm_table_ingestion
      - id: lookup_mode_is_field
        group: backend
        generated: swarm_lookup_mode_is_field
        threshold: {min: 1.0}
        diagnostic_category: swarm_table_ingestion
      - id: transport_values_finite
        group: interpolation
        generated: swarm_transport_values_finite
        threshold: {min: 1.0}
        diagnostic_category: swarm_table_ingestion
      - id: rate_values_finite
        group: interpolation
        generated: swarm_rate_values_finite
        threshold: {min: 1.0}
        diagnostic_category: swarm_table_ingestion
      - id: lookup_diagnostics_present
        group: diagnostics
        generated: swarm_lookup_diagnostics_present
        threshold: {min: 1.0}
        diagnostic_category: swarm_table_ingestion
      - id: clipping_diagnostics_present
        group: diagnostics
        generated: swarm_clipping_diagnostics_present
        threshold: {min: 1.0}
        diagnostic_category: swarm_table_ingestion

  - id: Runtime-1
    software: this code
    phase: phase1
    problem: local runtime and solver-stat profile
    case: null
    reference: null
    claim_level: context
    validates:
      - local wall time
      - nfev, njev, nlu
      - cold/warm timing split when repetitions > 1
    does_not_validate:
      - external executable speed except where separately measured
    metrics:
      - id: median_wall_time_s
        group: runtime
        generated: runtime_median_wall_time_s
        threshold: null
        diagnostic_category: runtime_context
      - id: nfev_median
        group: solver_stats
        generated: runtime_nfev_median
        threshold: null
        diagnostic_category: runtime_context
