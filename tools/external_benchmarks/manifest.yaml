benchmarks:
  - id: zdplaskin_example2_argon_dc_series
    case: ../../examples/configs/case_zdplaskin_example2.yaml
    comparison_tool: zdplaskin_example2
    field_comparison_tool: zdplaskin_eovern
    expectations:
      final_electron_density_m3:
        min: 1.0e17
        max: 4.0e17
      final_mean_electron_energy_eV:
        min: 0.5
        max: 3.0
      final_port_dc_series_drive_absorbed_power_W:
        min: 0.25
        max: 1.00
      final_port_dc_series_drive_gap_voltage_V:
        min: 20.0
        max: 120.0
  - id: crane_two_reaction_argon_ode_parity
    case: ../../examples/configs/case_crane_two_reaction_argon.yaml
    comparison_tool: crane_two_reaction_argon
    expectations:
      final_electron_density_m3:
        target: 2.1735277364398e19
        rtol: 5.0e-4
      final_self_bias_V:
        target: 0.0
        atol: 1.0e-30
  - id: pygmol_argon_global_model_sanity
    case: ../../examples/configs/case_argon_lxcat.yaml
    comparison_tool: pygmol_argon
    expectations:
      powered_ne_ratio_pygmol_over_local:
        min: 1.0e-3
        max: 1.0e3
      note: Broad executable-model sanity check only; PyGMol setup is not the same physics closure as the local LXCat/two-term case.
  - id: pygmol_argon_same_footing_decomposition
    case: ../../examples/configs/case_argon_lxcat.yaml
    comparison_tool: pygmol_same_footing
    expectations:
      production_final_ne_ratio_pygmol_over_local_after_rate_power_wall_alignment:
        min: 0.1
        max: 10.0
      note: External diagnostic only; stages align local electron-impact rates, absorbed power, and global ion wall-loss coefficient cumulatively without changing the core solver.
