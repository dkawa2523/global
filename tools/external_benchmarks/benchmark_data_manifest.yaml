benchmark_data:
  - id: zdplaskin_example2_output_derived_eovern_table
    role: strict_parity
    path: ../../examples/chemistry_zdplaskin_example2/tables/zdplaskin_example2_eovern_rates.h5
    sidecar_dir: ../../examples/chemistry_zdplaskin_example2/tables/zdplaskin_example2_eovern
    generator: tools/external_benchmarks/build_zdplaskin_output_rate_table.py
    source_url: https://github.com/Hemadityamalla/ZDPlaskin
    source_file: example2/Ar2Reac_1000V_100kOhm_100t_0.4d_0.4r.dat
    EoverN_Td:
      min: 1.597044
      max: 77.66399
    notes:
      - Used only for ZDPlaskin example2 final-state parity.
      - Rates are reverse-engineered from saved ZDPlaskin reaction-rate columns.
  - id: zdplaskin_example2_wide_diagnostic_eovern_table
    role: pressure_voltage_stress
    path: ../../examples/chemistry_zdplaskin_example2/tables/zdplaskin_example2_wide_eovern_rates.h5
    sidecar_dir: ../../examples/chemistry_zdplaskin_example2/tables/zdplaskin_example2_wide_eovern
    generator: tools/external_benchmarks/build_zdplaskin_rate_table.py
    source_url: https://github.com/Hemadityamalla/ZDPlaskin
    source_file: example2/bolsigdb.dat
    EoverN_Td:
      min: 0.5
      max: 250.0
      n_fields: 64
    notes:
      - Generated by this repository internal two-term-like solver from the imported ZDPlaskin cross sections.
      - Not a BOLSIG+ executable rerun and not a strict ZDPlaskin parity table.
  - id: crane_two_reaction_argon_reference
    role: scalar_ode_chemistry_reference
    path: ../../examples/external/crane_two_reaction_argon_reference.yaml
    source_url: https://github.com/lcpp-org/crane
    source_file: tutorials/TwoReactionArgon
    notes:
      - Used for reaction-network assembly, unit conversion, and stiff ODE comparison.
  - id: pygmol_argon_global_model_sanity
    role: executable_global_model_sanity_check
    path: ../../examples/outputs/argon_lxcat_icp_baseline/comparison_pygmol_summary.csv
    model_file: pygmol_argon_model.yaml
    source_url: https://pypi.org/project/pygmol/
    generator: tools/external_benchmarks/pygmol_argon.py
    notes:
      - PyGMol is executed locally when the optional compare dependency is installed.
      - The comparison uses an equivalent single cylinder and compact Ar Arrhenius chemistry, so it is an order/trend sanity check rather than strict physics parity.
      - Electron-impact rates are intentionally not aligned with the local LXCat production case and must stay outside core chemistry input.
  - id: pygmol_argon_local_rate_table
    role: executable_same_electron_collision_rate_check
    path: ../../examples/outputs/argon_lxcat_icp_baseline/comparison_pygmol_local_rate_table_summary.csv
    model_file: ../../examples/outputs/argon_lxcat_icp_baseline/comparison_pygmol_local_rate_table_model.yaml
    source_url: https://pypi.org/project/pygmol/
    generator: tools/external_benchmarks/pygmol_argon.py --rate-mode local-table
    notes:
      - PyGMol is executed with an external adapter that interpolates electron-impact coefficients from local LXCat/two-term rate tables.
      - This aligns electron-collision rates only; geometry, wall loss, flow, power coupling, and PyGMol equation-form differences remain.
      - Generated model data must stay outside plasma_global core chemistry inputs.
  - id: pygmol_argon_same_footing_decomposition
    role: external_benchmark_difference_decomposition
    path: ../../examples/outputs/argon_lxcat_icp_baseline/comparison_pygmol_same_footing_decomposition.csv
    report_file: ../../examples/outputs/argon_lxcat_icp_baseline/comparison_pygmol_same_footing_decomposition.yaml
    source_url: https://pypi.org/project/pygmol/
    generator: tools/external_benchmarks/pygmol_same_footing.py
    notes:
      - Cumulative external-adapter stages align local electron-impact rate tables, then local absorbed power, then local global ion wall-loss coefficient.
      - The decomposition changes only the PyGMol benchmark adapter; it does not change plasma_global core physics.
      - Used to decide whether power coupling or wall-loss assumptions dominate the PyGMol difference.
  - id: pygmol_argon_sensitivity_diagnostic
    role: external_benchmark_sensitivity_diagnostic
    path: ../../examples/outputs/argon_lxcat_icp_baseline/comparison_pygmol_sensitivity_summary.csv
    model_file: pygmol_argon_model.yaml
    generator: tools/external_benchmarks/pygmol_sensitivity.py
    notes:
      - Perturbs only PyGMol external-benchmark inputs.
      - Used to diagnose whether PyGMol rate, energy-loss, wall, geometry, or power assumptions dominate the difference.
      - Must not be used as a calibration source for production chemistry.
  - id: zdplaskin_public_examples_inventory
    role: external_reference_candidate_inventory
    path: ../../examples/external/zdplaskin_examples_inventory.yaml
    source_url: https://github.com/Hemadityamalla/ZDPlaskin
    generator: tools/external_benchmarks/zdplaskin_examples_inventory.py
    notes:
      - Classifies public ZDPlaskin examples into implemented strict benchmark, live-run-only candidate, and future driven-chemistry reference.
  - id: loki_o2_dc_glow_candidate_spec
    role: external_reference_candidate_spec
    path: ../../examples/external/loki_o2_dc_glow_candidate.yaml
    source_url: https://doi.org/10.1088/1361-6595/acbb9c
    notes:
      - Code-independent candidate spec for the LoKI low-pressure oxygen DC glow benchmark paper.
      - Fixes which paper figures and pressure-sweep quantities should be digitized before any local benchmark implementation.
      - Stays outside plasma_global core packages and does not prescribe a production chemistry input.
  - id: loki_o2_dc_glow_digitization_scaffold
    role: external_reference_candidate_digitization_scaffold
    path: ../../examples/external/loki_o2_dc_glow_digitized/schema.yaml
    report_file: ../../examples/external/loki_o2_dc_glow_digitization_report.yaml
    generator: tools/external_benchmarks/loki_o2_dc_glow_digitization.py
    source_url: https://doi.org/10.1088/1361-6595/acbb9c
    notes:
      - Creates empty CSV templates and a schema contract for digitizing the LoKI O2 DC glow benchmark figures.
      - Runs a readiness check without touching plasma_global core code or claiming physics parity.
      - The benchmark remains blocked until the primary pressure-sweep datasets are populated.
  - id: loki_o2_dc_glow_digitized_primary_benchmark
    role: external_reference_digitized_benchmark
    path: ../../examples/external/loki_o2_dc_glow_benchmark_summary.csv
    report_file: ../../examples/external/loki_o2_dc_glow_benchmark_report.yaml
    generator: tools/external_benchmarks/loki_o2_dc_glow_benchmark.py
    source_url: https://doi.org/10.1088/1361-6595/acbb9c
    notes:
      - Uses the external digitized LoKI pressure-sweep reference set and figure 11 envelope.
      - Evaluates direct main-parameter differences first, expands to the extended species sweep once figures 8, 9a, and 9b are digitized, and then adds full radial-profile diagnostics when figures 1, 2, 3, 4, 7b, and 10 are populated.
      - Does not call or modify plasma_global core modules.
